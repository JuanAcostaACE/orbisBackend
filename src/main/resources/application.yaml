server:
  port: ${PORT:8080}

spring:
  # ── Perfil default: H2 en memoria (sin DB externa, para desarrollo local) ──
  datasource:
    url: ${DB_URL:jdbc:h2:mem:orbis;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    # Sin 'hibernate.dialect': Spring Boot / Hibernate lo detecta automáticamente (evita HHH90000025)

  # ── Sesión HTTP ──
  session:
    timeout: 8h

# ── CORS ──
# APP_CORS_ORIGIN  = URL exacta del frontend en producción (sin trailing slash)
app:
  cors:
    origin: ${APP_CORS_ORIGIN:}
    origin2: ${APP_CORS_ORIGIN2:}

  # ── Autenticación de dispositivo ESP32 ──
  # Configurar en Railway Dashboard > Variables:
  #   APP_DEVICE_TOKEN       = <cadena aleatoria 32+ chars>   (secreto del dispositivo)
  #   APP_DEVICE_OWNER_EMAIL = correo@ejemplo.com             (usuario propietario de eventos del dispositivo)
  # Si APP_DEVICE_TOKEN está vacío, la autenticación por dispositivo queda deshabilitada.
  device:
    token: ${APP_DEVICE_TOKEN:}
    ownerEmail: ${APP_DEVICE_OWNER_EMAIL:}

---
# PERFIL: prod (Railway + PostgreSQL)
# Activar con: SPRING_PROFILES_ACTIVE=prod en Railway Dashboard
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  h2:
    console:
      enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false