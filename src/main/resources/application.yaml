server:
  port: ${PORT:8080}

spring:
  # ── Perfil default: H2 en memoria (sin DB externa, para desarrollo local) ──
  datasource:
    url: ${DB_URL:jdbc:h2:mem:orbis;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    # Sin 'hibernate.dialect': Spring Boot / Hibernate lo detecta automáticamente (evita HHH90000025)

  # ── Sesión HTTP ──
  session:
    timeout: 8h

# ── CORS (URL del frontend en producción) ──
# Configurar en Railway Dashboard > Variables:
#   APP_CORS_ORIGIN  = https://tu-proyecto.vercel.app   (URL exacta, sin trailing slash)
app:
  cors:
    origin: ${APP_CORS_ORIGIN:}
    origin2: ${APP_CORS_ORIGIN2:}

---
# PERFIL: prod (Railway + PostgreSQL)
# Activar con: SPRING_PROFILES_ACTIVE=prod en Railway Dashboard
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  h2:
    console:
      enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false